<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Mahesh Jan Sewa Kendra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .contact-container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { color: #333; text-align: center; }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .social-links a {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            color: #fff;
            font-weight: bold;
        }
        .instagram { background: #E1306C; }
        .email { background: #007BFF; }

        /* Chatbot Styling */
        .chat-widget {
            margin-top: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background: #fafafa;
        }
        .chat-header {
            background: #333;
            color: #fff;
            padding: 12px;
            font-weight: bold;
            text-align: center;
        }
        .chat-box {
            height: 250px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px;
            border-radius: 6px;
            max-width: 80%;
            font-size: 14px;
        }
        .bot-msg { background: #e2e8f0; align-self: flex-start; color: #333; }
        .user-msg { background: #3b82f6; align-self: flex-end; color: anshu; color: #fff; }
        
        .chat-input-area {
            display: flex;
            border-top: 1px solid #ddd;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
        }
        .chat-input-area button {
            padding: 12px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input-area button:hover { background: #2563eb; }
    </style>
</head>
<body>

<div class="contact-container">
    <h2>Contact Us</h2>
    <p style="text-align: center; color: #666;">Humse judne ke liye niche diye gaye madhyamo ka upyog karein:</p>
    
    <!-- Social & Email Links -->
    <div class="social-links">
        <a href="https://www.instagram.com/itz____.ashu?stkn=MXNteDI1eXlvMTd6bw==" target="_blank" class="instagram">Instagram</a>
        <a href="mailto:ashwanieditz4@gmail.com" class="email">Email Us</a>
    </div>

    <!-- AI Assistant / Chatbot Section -->
    <div class="chat-widget">
        <div class="chat-header">AI Support Assistant (Mahesh Jan Sewa Kendra)</div>
        <div class="chat-box" id="chatBox">
            <div class="message bot-msg">Hello! Main Ashwani ka AI Assistant hoon. Bataiye, booking ya payment me main aapki kya madad kar sakta hoon?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Yahan apni problem likhein..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        let text = inputField.value.trim();
        
        if (text === "") return;

        chatBox.innerHTML += `<div class="message user-msg">${text}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        setTimeout(() => {
            let reply = "Main aapki query par kaam kar raha hoon. Agar yeh ticket/booking ya payment se juda hai aur solve nahi ho raha, toh kripya seedha email karein.";
            
            const lowerText = text.toLowerCase();
            if (lowerText.includes('payment') || lowerText.includes('paisa') || lowerText.includes('refund') || lowerText.includes('fail')) {
                reply = "Payment ya refund me issue aane par aap apna PNR / Details ke sath seedha yahan email bhej sakte hain: <a href='mailto:ashwanieditz4@gmail.com'>ashwanieditz4@gmail.com</a>. Ashwani jald hi aapse sampark karenge.";
            } else if (lowerText.includes('train') || lowerText.includes('flight') || lowerText.includes('ticket') || lowerText.includes('booking')) {
                reply = "Aapko train, bus ya flight booking se related kya jankari chahiye? Details yahan share karein.";
            }

            chatBox.innerHTML += `<div class="message bot-msg">${reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 1000);
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
